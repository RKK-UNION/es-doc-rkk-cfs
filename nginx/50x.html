  <title>Сайт временно недоступен — ES Doc</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --bg: #301317;
      --bg-chrome: #260f12;
      --ink: #fff0cc;
      --ink-soft: #f4d9b8;
      --accent: #ffd45c;
      --accent-hover: #ffe599;
      --danger: #e05742;
      --border: #66221e;
      --hover: #73251e;
      --fs-display: clamp(1.85rem, 4.5vw, 2.8rem);
      --fs-body: 1rem;
      --fs-ui: .875rem;
      --fs-label: .75rem;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg-chrome); }
    body {
      margin: 0;
      color: var(--ink);
      font: var(--fs-body)/1.7 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    ::selection { color: var(--bg); background: var(--accent); }
    main {
      display: grid;
      align-content: center;
      width: 100%;
      max-width: 56rem;
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding: 48px 64px;
      border-inline: 1px solid var(--border);
      background: var(--bg);
      text-align: left;
      overflow-wrap: anywhere;
    }
    img {
      display: block;
      width: 224px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 32px;
    }
    h1 {
      margin: 0 0 24px;
      font: 700 var(--fs-display)/1.35 "PT Serif", Georgia, "Times New Roman", serif;
      letter-spacing: -.01em;
      text-wrap: balance;
    }
    .message {
      max-width: 65ch;
      margin: 0;
      color: var(--ink-soft);
      hyphens: auto;
    }
    a { color: var(--accent); text-underline-offset: .2em; }
    .message a { text-decoration-color: var(--danger); }
    .message a:hover, .message a:focus-visible { text-decoration-color: currentColor; }
    a:hover { color: var(--accent-hover); }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 32px; }
    nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: var(--fs-ui);
      font-weight: 600;
      line-height: 1.5;
      text-decoration: none;
    }
    nav a:first-child { color: var(--bg); background: var(--accent); border-color: var(--accent); }
    nav a:first-child:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    nav a:not(:first-child):hover { background: var(--hover); }
    nav a:active { border-color: currentColor; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .status {
      margin: 48px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--ink-soft);
      font: 600 var(--fs-label)/1.5 ui-monospace, Consolas, "Courier New", monospace;
      letter-spacing: .1em;
    }
    @media (max-width: 50em) { main { padding-inline: 24px; } }
    @media (max-width: 40em) {
      main { padding: 32px 16px; border-inline: 0; }
      img { width: 192px; margin-bottom: 24px; }
      nav { align-items: stretch; flex-direction: column; gap: 12px; }
      .status { margin-top: 32px; }
    }
    @media (forced-colors: active) {
      main, .status { border-color: CanvasText; }
      nav a { border-color: ButtonText; }
      a:focus-visible { outline-color: Highlight; }
      .message a { text-decoration-color: LinkText; }
    }
  </style>
</head>
