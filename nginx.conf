events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Preserve application responses, including errors handled by FastAPI.
        # Unhandled exceptions explicitly opt in via X-Accel-Redirect below.
        proxy_intercept_errors off;
        error_page 500 501 502 503 504 505 506 507 508 510 511 /_nginx/50x.html;

        location = /_nginx/server-error {
            internal;
            # A direct redirect to a static file would return 200. Generate a
            # local 500 first so error_page serves the file with the right status.
            return 500;
        }

        location = /_nginx/50x.html {
            internal;
            root /usr/share/nginx/html;
            charset utf-8;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass http://web:8000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
